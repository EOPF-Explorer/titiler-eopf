[project]
name = "titiler-eopf"
description = "TiTiler application for EOPF datasets"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Vincent Sarago", email = "vincent@developmentseed.com"},
    {name = "Emmanuel Mathot", email = "emmanuel@developmentseed.com"},
]
keywords = [
    "TiTiler",
    "EOPF",
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]
dependencies = [
    "titiler-core>=2.1,<3.0",
    "titiler-xarray>=2.1,<3.0",
    "titiler-extensions>=2.1,<3.0",
    "titiler-stacapi>=2.0,<3.0",
    "rioxarray>=0.22",
    "zarr[cast-value-rs]>=3.2.0",
    "orjson",
    "obstore",
    "pydantic-settings~=2.0",
    "starlette-cramjam>=0.4,<1.0",
    "rio-tiler>=9.1,<10.0",
]

[project.optional-dependencies]
openeo = [
    "titiler-openeo[oidc]>=0.18,<0.19",
    "openeo",
    "duckdb",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "cryptography",
]
cache = [
    "titiler-cache[redis,s3]",
]

[project.urls]
Homepage = 'https://github.com/EOPF-Explorer/titiler-eopf'
Documentation = "https://github.com/EOPF-Explorer/titiler-eopf"
Issues = "https://github.com/EOPF-Explorer/titiler-eopf/issues"
Source = "https://github.com/EOPF-Explorer/titiler-eopf"
Changelog = "https://github.com/EOPF-Explorer/titiler-eopf/CHANGELOG.md"

[tool.uv]
# The `openeo` client package (notebook/exploratory use only, see the
# `openeo` extra) caps `pystac<1.12`. That cap breaks this app's own
# `get_all_band_names` (titiler/eopf/openeo/stacapi.py), which relies on
# `pystac.Collection.item_assets` being populated from a collection whose
# `stac_extensions` does not declare the item-assets extension -- pystac
# only did that unconditionally as of 1.12+. Overriding the cap here keeps
# `openeo` installable without dragging pystac back below what the rest of
# this app needs; verified `openeo`'s own STAC handling still works against
# pystac 1.14.3.
override-dependencies = ["pystac>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "titiler/eopf/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["titiler"]

[tool.hatch.build.targets.wheel]
only-include = ["titiler"]

[tool.hatch.metadata]
allow-direct-references = true