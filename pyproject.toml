[project]
name = "titiler.eopf"
version = "0.10.1"
description = "TiTiler application for EOPF datasets"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Vincent Sarago", email = "vincent@developmentseed.com"},
    {name = "Emmanuel Mathot", email = "emmanuel@developmentseed.com"},
]
keywords = [
    "TiTiler",
    "EOPF",
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "orjson",
    "titiler-core>=2.0,<3.0",
    "titiler-xarray>=2.0,<3.0",
    "titiler-extensions>=2.0,<3.0",
    "titiler-stacapi>=2.0,<3.0",
    "rioxarray>=0.22",
    "zarr[cast-value-rs]>=3.2.0",
    "obstore",
    "pydantic-settings~=2.0",
    "starlette-cramjam>=0.4,<1.0",
    "rio-tiler>=9.1,<10.0",
]

[project.optional-dependencies]
openeo = [
    "titiler-openeo>=0.18,<0.19",
    "openeo",
    "duckdb",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "cryptography",
    "httpx",
]
cache = [
    "redis",
    "boto3",
]
server = [
    "uvicorn[standard]",
    "uvicorn-worker",
    "gunicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "httpx",
    "fakeredis",
    "duckdb",
    "sqlalchemy>=2.0.0",
    "cryptography",
    "pre-commit",
    "bump-my-version",
    "boto3",
    "titiler-openeo>=0.18,<0.19",
    "ipython",
    "ipykernel",
    "jupyter-client",
    "matplotlib",
    "folium",
    "owslib",
]

performance = [
    "pytest-benchmark",
]

[project.urls]
Homepage = 'https://github.com/EOPF-Explorer/titiler-eopf'
Documentation = "https://github.com/EOPF-Explorer/titiler-eopf"
Issues = "https://github.com/EOPF-Explorer/titiler-eopf/issues"
Source = "https://github.com/EOPF-Explorer/titiler-eopf"
Changelog = "https://github.com/EOPF-Explorer/titiler-eopf/CHANGELOG.md"

[tool.uv]
# The `openeo` client package (notebook/exploratory use only, see the
# `openeo` extra) caps `pystac<1.12`. That cap breaks this app's own
# `get_all_band_names` (titiler/eopf/openeo/stacapi.py), which relies on
# `pystac.Collection.item_assets` being populated from a collection whose
# `stac_extensions` does not declare the item-assets extension -- pystac
# only did that unconditionally as of 1.12+. Overriding the cap here keeps
# `openeo` installable without dragging pystac back below what the rest of
# this app needs; verified `openeo`'s own STAC handling still works against
# pystac 1.14.3.
override-dependencies = ["pystac>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["titiler/"]

[tool.hatch.build.targets.wheel]
only-include = ["titiler/"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
known_first_party = ["titiler"]
known_third_party = [
    "rasterio",
    "morecantile",
    "rio_tiler",
    "geojson_pydantic",
    "starlette_cramjam",
]
default_section = "THIRDPARTY"

[tool.ruff.lint]
select = [
    "D1",  # pydocstyle errors
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # flake8
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B905",  # ignore zip() without an explicit strict= parameter, only support with python >3.10
]

[tool.mypy]
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
exclude = "tests/.*|.*github/.*"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
]
