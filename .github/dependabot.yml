# Set update schedule for GitHub Actions, the Dockerfile base image and the
# Python dependencies in uv.lock

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    groups:
      all:
        patterns:
        - "*"

  # Moves the digest-pinned images in the Dockerfile (the Wolfi base and the
  # uv stage); nothing else does.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # titiler-openeo gets its own PR: the openEO deployments depend on its fixes,
  # and a stale pin once shipped 0.18.0 after 0.18.3 was out.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      titiler-openeo:
        patterns:
        - "titiler-openeo"
      python:
        patterns:
        - "*"
        exclude-patterns:
        - "titiler-openeo"
