# Set update schedule for GitHub Actions and the Dockerfile base image

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    groups:
      all:
        patterns:
        - "*"

  # Not optional. The Dockerfile pins cgr.dev/chainguard/wolfi-base by digest
  # because ":latest" is the only free Chainguard tag — so the digest IS the
  # version, and this entry is the only thing that moves it. Without it the base
  # image quietly ages while every build stays green: no error, no warning, just
  # an increasingly stale rootfs that Trivy will eventually start complaining
  # about. Deleting this entry silently disables base-image updates.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
