# Set update schedule for GitHub Actions and the Dockerfile base image

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    groups:
      all:
        patterns:
        - "*"

  # Moves the digest-pinned Wolfi base in the Dockerfile; nothing else does.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
