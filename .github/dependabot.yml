# Set update schedule for GitHub Actions, the Dockerfile base image and the
# Python dependencies in uv.lock

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Half the weekly PRs were replaced by the next week's before anyone
      # merged them.
      interval: "monthly"
    groups:
      all:
        patterns:
        - "*"

  # Moves the digest-pinned images in the Dockerfile (the Wolfi base and the
  # uv stage); nothing else does. Weekly, as the base image carries CVE fixes.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
        - "*"

  # titiler-openeo gets its own PR: the openEO deployments depend on its fixes,
  # and a stale pin once shipped 0.18.0 after 0.18.3 was out.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Above the default 5, so the two version groups still open next to the
    # open security PRs.
    open-pull-requests-limit: 10
    groups:
      # Dependabot names it "titiler-openeo[oidc]", extra included
      # (dependabot/dependabot-core#16431), so match with a wildcard.
      titiler-openeo:
        patterns:
        - "titiler-openeo*"
      python:
        patterns:
        - "*"
        exclude-patterns:
        - "titiler-openeo*"
      # The groups above only apply to version updates, so without this each
      # security advisory opens its own PR.
      security:
        applies-to: security-updates
        patterns:
        - "*"
