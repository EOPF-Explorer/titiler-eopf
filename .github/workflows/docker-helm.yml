name: Docker and Helm

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - main
  pull_request:
  # Trigger on GitHub releases created by Release Please
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:

    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone repo and supply Docker build context.
      packages: write # Push the image to ghcr.io.
      actions: write # Persist Docker layer cache for docker/build-push-action (type=gha).
      security-events: write # Upload Trivy SARIF to the GitHub Security tab.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            # For release events, extract version from release tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Authenticate with GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build once, into the local daemon. Nothing is published until Trivy and
      # the smoke test have cleared this exact image: the push step below uploads
      # these very tags, it does not rebuild.
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The nightly exists to catch upstream drift, but with a digest-pinned
          # base and cache mode=max it would be a pure cache hit, so Trivy would
          # re-report yesterday's answer. A cold build re-resolves apk and PyPI,
          # the only things that can change overnight. (`pull:` would be
          # redundant — the FROM line is pinned by digest.)
          no-cache: ${{ github.event_name == 'schedule' }}

      # Scanned by image ID rather than by tag: every tag above points at this
      # ID, and it does not depend on the order metadata-action emits tags in.
      - name: Scan image with Trivy (SARIF CRITICAL/HIGH, incl. unfixed)
        id: trivy-sarif-critical-high
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: sarif
          output: trivy-results-critical-high.sarif
          exit-code: '0'
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Warn on fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      # Gates the push: an image that fails its runtime contract never reaches
      # ghcr.io. See docker/smoke-test.sh for what it asserts. By image ID, as
      # the Trivy steps above; via env: so nothing is interpolated into run:.
      - name: Smoke-test the image runtime contract
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageid }}
        run: ./docker/smoke-test.sh "$IMAGE_REF"

      - name: Push Docker image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$META_TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            docker push "$tag"
          done

      # Insurance against registry-level removal, the one failure the digest pin
      # does not cover: keep a copy of the exact pinned base under this org.
      # imagetools copies the whole index registry-to-registry, so the mirror
      # preserves the digest — recovery is a one-line FROM flip to
      # ghcr.io/<org>/wolfi-base:<sha256-...>. Reads the ref from the Dockerfile
      # so a Dependabot bump re-mirrors on merge with no edit here. Skipped on
      # PRs: fork PRs get a read-only GITHUB_TOKEN.
      - name: Mirror the pinned base image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base="$(sed -n 's/^FROM \(cgr\.dev\/chainguard\/wolfi-base[^ ]*\).*/\1/p' Dockerfile)"
          digest="${base##*@}"
          docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wolfi-base:${digest/:/-}" "$base"

      # Fork PRs get a read-only GITHUB_TOKEN, so the upload would fail there.
      - name: Upload Trivy SARIF (CRITICAL/HIGH) to GitHub Security tab
        if: steps.trivy-sarif-critical-high.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results-critical-high.sarif
          category: trivy-critical-high

  helm:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.9.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --chart-dirs helm --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Version
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          "$pythonLocation/bin/python" -m pip install -e .
          "$pythonLocation/bin/python" -m pip install pyyaml
          "$pythonLocation/bin/python" .github/workflows/scripts/check_version.py

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --chart-dirs helm --target-branch ${{ github.event.repository.default_branch }}

      - name: Authenticate with GitHub Packages
        if: steps.list-changed.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: SHA Tag
        id: vars
        run: echo "sha_tag=sha-$(git rev-parse --short HEAD)" >>${GITHUB_ENV}

      # Matches metadata-action's type=sha: both derive from GITHUB_SHA, which on
      # a pull_request is the refs/pull/N/merge commit checkout leaves at HEAD.
      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ env.REPO }}:${{ env.sha_tag }}
          docker tag ghcr.io/${{ env.REPO }}:${{ env.sha_tag }} titiler-eopf:ci

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Load container image in kind cluster
        run: kind load docker-image titiler-eopf:ci --name chart-testing

      - name: Create Namespace
        run: |
          kubectl create namespace titiler-eopf

      # Empty on fork PRs, where secrets are not exposed. Fine: nothing the
      # install exercises reads S3, the secret just has to exist so the pod's
      # envFrom resolves. Via env: so a value containing shell metacharacters
      # cannot be executed.
      - name: Create Secret
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          kubectl create secret generic titiler-eopf-secret -n titiler-eopf \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"

      # Unconditional, rather than gated on list-changed: a new image is likelier
      # to break the chart than a new chart is, and the gate meant a
      # Dockerfile-only PR installed nothing. Check Version and ct lint stay
      # gated — they compare the chart version against the Python package
      # version, which only means anything when the chart changed.
      # --all because `ct install` on its own installs only *changed* charts.
      # Do NOT add --skip-clean-up: it gates ct's own events/describe/logs dump
      # (PrintEventsPodDetailsAndLogs sits inside the cleanup closure), which is
      # release-scoped and includes init containers.
      - name: Run chart-testing (install)
        run: ct install --chart-dirs helm --namespace titiler-eopf --all

      # delete the pull request docker image to free up space
      - name: Delete Docker image
        if: always()
        run: |
          docker rmi ghcr.io/${{ env.REPO }}:${{ env.sha_tag }} || echo "Image not found, skipping deletion."
