name: Docker and Helm

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - main
  pull_request:
  # Trigger on GitHub releases created by Release Please
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:

    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone repo and supply Docker build context.
      packages: write # Push the image to ghcr.io.
      actions: write # Persist Docker layer cache for docker/build-push-action (type=gha).
      security-events: write # Upload Trivy SARIF to the GitHub Security tab.

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            # For release events, extract version from release tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Authenticate with GitHub Packages
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build once, into the local daemon. Nothing is published until Trivy and
      # the smoke test have cleared this exact image: the push step below uploads
      # these very tags, it does not rebuild.
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The nightly run exists to catch upstream drift, and with a
          # digest-pinned base plus `cache-to: mode=max` it would otherwise be a
          # pure cache hit: an identical image, and a Trivy scan re-reporting
          # yesterday's answer. Forcing a cold build makes it re-resolve apk
          # packages from Wolfi and Python packages from PyPI, which is the only
          # thing here that can actually change overnight.
          # `pull: true` would be redundant — the FROM line is pinned by digest,
          # so there is nothing newer to pull.
          no-cache: ${{ github.event_name == 'schedule' }}

      # Scanned by image ID rather than by tag: every tag above points at this
      # ID, and it does not depend on the order metadata-action emits tags in.
      - name: Scan image with Trivy (SARIF CRITICAL/HIGH, incl. unfixed)
        id: trivy-sarif-critical-high
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: sarif
          output: trivy-results-critical-high.sarif
          exit-code: '0'
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Warn on fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      # Sits between the Trivy gates and the push, so an image that fails its
      # runtime contract can never reach ghcr.io. What this catches that a build
      # cannot: `uvicorn` no longer resolving as a bare executable on PATH (all
      # three HelmReleases run `command: ["uvicorn"]`), a non-root uid that
      # cannot bind :80, a missing /bin/sh for the shell-form CMD, and the
      # vendored GDAL/PROJ .so files inside the manylinux wheels failing to load.
      # Every one of those fails only at runtime, on rollout.
      #
      # By image ID rather than by tag, for the same reason the Trivy steps do:
      # every tag points at this ID, and it does not depend on the order
      # metadata-action emits tags in. Passed through env: so there is no inline
      # ${{ }} interpolation in a run: block.
      - name: Smoke-test the image runtime contract
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageid }}
        run: ./docker/smoke-test.sh "$IMAGE_REF"

      - name: Push Docker image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$META_TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            docker push "$tag"
          done

      # Fork PRs get a read-only GITHUB_TOKEN, so the upload would fail there.
      - name: Upload Trivy SARIF (CRITICAL/HIGH) to GitHub Security tab
        if: steps.trivy-sarif-critical-high.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-results-critical-high.sarif
          category: trivy-critical-high

  helm:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.9.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --chart-dirs helm --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Version
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          "$pythonLocation/bin/python" -m pip install -e .
          "$pythonLocation/bin/python" -m pip install pyyaml
          "$pythonLocation/bin/python" .github/workflows/scripts/check_version.py

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --chart-dirs helm --target-branch ${{ github.event.repository.default_branch }}

      # Everything from here down used to be gated on `list-changed`, which meant
      # a PR that changed only the Dockerfile installed nothing and went green
      # having tested the image not at all. (Doubly so: `ct install` on its own
      # only installs *changed* charts.) The install path is now unconditional,
      # because the thing most likely to break the chart is a new image, not a
      # new chart. `ci/default-values.yaml` overrides only repository and tag, so
      # the real defaults are exercised — securityContext:{} (root), :80,
      # command: uvicorn, and both probes on /_mgmt/ping.
      #
      # `Check Version` and `ct lint` stay gated: they compare the chart version
      # against the Python package version, which is only meaningful when the
      # chart actually changed.
      - name: Authenticate with GitHub Packages
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: SHA Tag
        id: vars
        run: echo "sha_tag=sha-$(git rev-parse --short HEAD)" >>${GITHUB_ENV}

      # `sha_tag` matches metadata-action's `type=sha` because both derive from
      # GITHUB_SHA: on a pull_request that is the refs/pull/N/merge commit, which
      # is also what actions/checkout leaves at HEAD. Verified against run
      # 30533390729, where the tag was sha-dfd608a and dfd608a is the merge
      # commit, not the branch tip.
      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ env.REPO }}:${{ env.sha_tag }}
          docker tag ghcr.io/${{ env.REPO }}:${{ env.sha_tag }} titiler-eopf:ci

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Load container image in kind cluster
        run: kind load docker-image titiler-eopf:ci --name chart-testing

      - name: Create Namespace
        run: |
          kubectl create namespace titiler-eopf

      # Empty on fork PRs, where these secrets are not exposed. That is fine:
      # nothing the install exercises reads S3, the secret just has to exist so
      # the pod's envFrom can resolve.
      #
      # Passed via env: rather than inline ${{ }}. This step used to run only on
      # chart PRs; now that it runs on every PR, interpolating a secret straight
      # into a shell command is worth not doing — a value containing shell
      # metacharacters would be executed rather than passed.
      - name: Create Secret
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          kubectl create secret generic titiler-eopf-secret -n titiler-eopf \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"

      # --all, not the default change detection: this PR changes no chart, and
      # without it `ct install` would find nothing to install and exit 0.
      #
      # --skip-clean-up so the failure dump below has something to look at. ct
      # otherwise deletes the release on its way out, which would leave the next
      # step describing an empty namespace. The runner is ephemeral, so leaving
      # the release behind on success costs nothing.
      - name: Run chart-testing (install)
        run: ct install --chart-dirs helm --namespace titiler-eopf --all --skip-clean-up

      # Deployment events and pod logs, so a probe timeout is diagnosable rather
      # than just a red X. A failure here points at the image contract first:
      # `uvicorn` not on PATH, or a uid that cannot bind :80. No label selector —
      # ct picks its own release name, so anything narrower risks matching
      # nothing and reporting silence as health.
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods,events -n titiler-eopf -o wide || true
          kubectl describe pods -n titiler-eopf || true
          for pod in $(kubectl get pods -n titiler-eopf -o name || true); do
            echo "===== logs: $pod"
            kubectl logs -n titiler-eopf "$pod" --all-containers --tail=100 || true
          done

      # delete the pull request docker image to free up space
      - name: Delete Docker image
        if: always()
        run: |
          docker rmi ghcr.io/${{ env.REPO }}:${{ env.sha_tag }} || echo "Image not found, skipping deletion."
